
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Control Center</title>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@xyflow/react": "https://esm.sh/@xyflow/react@12.4.2"
  }
}
</script>
<style>
  :root {
    --bg-color: #050507;
    --grid-color: #1a1a24;
    --accent-color: #10b981;
  }

  @keyframes borderPulse {
    0%, 100% { box-shadow: 0 0 8px 2px rgba(34,211,238,0.7); }
    50% { box-shadow: 0 0 2px 0px rgba(34,211,238,0.15); }
  }
  
  .react-flow__pane {
    background-color: var(--bg-color);
    background-image: 
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
      linear-gradient(rgba(24, 24, 27, 0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(24, 24, 27, 0.4) 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    background-position: center center;
    cursor: crosshair !important;
  }

  .react-flow__node-pocket {
    z-index: 0 !important;
  }

  /* SPACE PANNING & RIGHT CLICK PANNING LOGIC */
  .space-panning .react-flow__pane,
  .right-panning .react-flow__pane {
    cursor: grab !important;
  }
  .space-panning .react-flow__pane:active,
  .right-panning .react-flow__pane:active {
    cursor: grabbing !important;
  }
  
  .space-panning .react-flow__node,
  .space-panning .react-flow__edge,
  .right-panning .react-flow__node,
  .right-panning .react-flow__edge {
    pointer-events: none !important;
  }

  /* NODE STYLES */
  .react-flow__node {
    background: transparent !important;
    border-radius: 1rem; /* Matches rounded-2xl roughly */
    width: fit-content;
    padding: 0 !important;
    border: none !important;
    
    /* GPU ACCELERATION HINTS */
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
    perspective: 1000px;
  }
  
  .react-flow__node:focus { outline: none; }

  /* Wrapper selection glow - subtle backing */
  .react-flow__node.selected {
    z-index: 50;
  }

  /* Ensure controls are always clickable even when node is selected */
  .react-flow__node .nodrag:not(.react-flow__resize-control) {
    cursor: pointer !important;
    pointer-events: all !important;
  }
  
  .react-flow__node input[type="text"].nodrag,
  .react-flow__node input[type="number"].nodrag {
    cursor: text !important;
  }
  
  .react-flow__node input[type="range"].nodrag {
    cursor: pointer !important; /* Changed from ew-resize to pointer */
  }
  
  /* Disable interaction with the lasso selection helper to prevent blocking pane click */
  .react-flow__selection {
    pointer-events: none !important;
  }
  
  /* Remove default border from React Flow */
  .react-flow__node-input, .react-flow__node-default, .react-flow__node-output, .react-flow__node-group {
    border: none;
  }

  /* Style lasso selection box and nodes selection box */
  .react-flow__selection,
  .react-flow__nodesselection-rect {
    background: rgba(16, 185, 129, 0.03) !important;
    border: 1.5px dashed var(--accent-color) !important;
    border-radius: 12px !important;
  }

  /* EDGE STYLES - OPTIMIZED: No continuous animation by default */
  .react-flow__edge-path { 
    stroke: var(--accent-color); 
    stroke-width: 2; 
    stroke-dasharray: 10, 5;
    opacity: 0.4;
    transition: opacity 0.2s, stroke-width 0.2s;
  }
  
  @keyframes flow {
    from { stroke-dashoffset: 30; }
    to { stroke-dashoffset: 0; }
  }

  /* Only animate on hover or selection to save CPU/GPU in idle */
  .react-flow__edge:hover .react-flow__edge-path,
  .react-flow__edge.selected .react-flow__edge-path { 
    opacity: 1; 
    stroke-width: 3;
    filter: drop-shadow(0 0 4px var(--accent-color));
    animation: flow 1s linear infinite;
  }

  /* 
     ALT DELETE MODE STYLES
  */
  
  /* 1. When Alt is pressed, all edges turn pinkish/dim */
  .alt-active .react-flow__edge-path {
    stroke: #fda4af !important; /* rose-300 */
    opacity: 0.4 !important;
    stroke-width: 2 !important;
    stroke-dasharray: 0 !important; /* Solid line */
    animation: none !important; /* Stop animation */
    transition: all 0.2s ease;
  }

  /* 2. When hovering an edge in Alt mode, it becomes bright red and bold */
  .alt-active .react-flow__edge:hover .react-flow__edge-path {
    stroke: #ef4444 !important; /* red-500 */
    stroke-width: 6 !important; /* Bold */
    opacity: 1 !important;
    filter: drop-shadow(0 0 6px #ef4444);
    cursor: pointer !important;
  }
  
  /* Make sure the edge is clickable in this state */
  .alt-active .react-flow__edge {
    cursor: pointer;
  }
  
  /* HANDLE STYLES - Bigger (16px) & Centered Animation */
  .react-flow__handle { 
    background: var(--accent-color); 
    border: 3px solid #050507; 
    width: 16px; 
    height: 16px; 
    border-radius: 50%;
    /* Transition only specific properties to avoid fighting React Flow's positioning */
    transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    z-index: 10;
  }
  
  .react-flow__handle:hover { 
    background-color: #fff;
    border-color: var(--accent-color);
    box-shadow: 0 0 8px var(--accent-color);
  }

  /* 
     Fix for Handle Drift: 
     React Flow uses transform: translate(...) to position handles.
     We must include that translation in our hover scale to keep it centered.
  */
  .react-flow__handle-left {
    left: 0;
    transform: translate(-50%, -50%);
  }
  .react-flow__handle-right {
    right: 0;
    transform: translate(50%, -50%);
  }
  .react-flow__handle-top {
    top: 0;
    transform: translate(-50%, -50%);
  }
  .react-flow__handle-bottom {
    bottom: 0;
    transform: translate(-50%, 50%);
  }

  /* Hover States with maintained translation */
  .react-flow__handle-left:hover {
    transform: translate(-50%, -50%) scale(1.4);
  }
  .react-flow__handle-right:hover {
    transform: translate(50%, -50%) scale(1.4);
  }
  .react-flow__handle-top:hover {
    transform: translate(-50%, -50%) scale(1.4);
  }
  .react-flow__handle-bottom:hover {
    transform: translate(-50%, 50%) scale(1.4);
  }
  
  /* CONTROLS (Bottom Left Menu) STYLES */
  .react-flow__controls {
    background: #09090b !important; /* zinc-950 */
    border: 1px solid #27272a !important; /* zinc-800 */
    border-radius: 0.75rem !important;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8) !important;
    padding: 2px;
    display: flex;
    flex-direction: column;
  }
  
  .react-flow__controls-button {
    background: transparent !important;
    border: none !important;
    border-bottom: 1px solid #27272a !important;
    margin: 0 !important;
    border-radius: 4px !important;
    transition: all 0.2s;
    width: 28px !important;
    height: 28px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  
  .react-flow__controls-button svg {
    fill: #10b981 !important; /* emerald-500 */
    max-width: 14px;
    max-height: 14px;
  }
  
  .react-flow__controls-button:hover {
    background: #27272a !important;
  }
  
  .react-flow__controls-button:last-child {
    border-bottom: none !important;
  }

  .custom-context-menu {
    position: fixed;
    z-index: 10000;
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  
  .context-menu-item {
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 800;
    color: #a1a1aa;
    text-transform: uppercase;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .context-menu-item:hover { background: #10b981; color: #fff; }
  .context-menu-item.text-red-500:hover { background: #ef4444; color: #fff; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 overflow-hidden">
    <div id="root"></div>
    <div id="portal-root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
